# templates/terraform.yml
.terraform_apply: &terraform_apply
  stage: deploy-dev
  image: hashicorp/terraform:1.6.0
  before_script:
    - cd terraform/environments/$ENV
    - |
      terraform init \
        -backend-config="storage_account_name=$TF_STORAGE_ACCOUNT" \
        -backend-config="container_name=$TF_CONTAINER" \
        -backend-config="key=$ENV/$CI_PROJECT_NAME.tfstate"
  script:
    - terraform plan -out=plan.tfplan
    - terraform apply -auto-approve plan.tfplan
  after_script:
    - rm -f plan.tfplan
  tags:
    - terraform

terraform-dev:
  <<: *terraform_apply
  variables:
    ENV: dev
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - terraform/**/*

terraform-staging:
  <<: *terraform_apply
  variables:
    ENV: staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - terraform/**/*
  needs:
    - terraform-dev

terraform-prod:
  <<: *terraform_apply
  variables:
    ENV: prod
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_TAG
      changes:
        - terraform/**/*
  needs:
    - terraform-staging
  when: manual
