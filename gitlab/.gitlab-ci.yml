# .gitlab-ci.yml
stages:
  - build
  - test
  - deploy-dev
  - deploy-staging
  - deploy-prod
  - notify

variables:
  DOCKER_REGISTRY: myregistry.azurecr.io
  K8S_NAMESPACE_DEV: dev
  K8S_NAMESPACE_STAGING: staging
  K8S_NAMESPACE_PROD: production
  HELM_RELEASE_PREFIX: $CI_PROJECT_NAME

include:
  - local: templates/build.yml
  - local: templates/deploy.yml
  - local: templates/terraform.yml
  - local: templates/notify.yml

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG
