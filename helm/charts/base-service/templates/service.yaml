apiVersion: v1
kind: Service
metadata:
  name: { { include "base-service.fullname" . } }
  namespace: { { .Values.namespace } }
  labels: { { - include "base-service.labels" . | nindent 4 } }
spec:
  type: ClusterIP
  ports:
    - port: { { .Values.service.port } }
      targetPort: { { .Values.service.targetPort } }
      protocol: TCP
  selector: { { - include "base-service.selectorLabels" . | nindent 4 } }
