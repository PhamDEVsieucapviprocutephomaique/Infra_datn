image:
  repository:""
  tag:"latest"
  pullPolicy: IfNotPresent

replicas:1


service:
  port:80
  type: 8080

ingress:
  enabled: false
  host:""
  annotations:
    kubernetes.io/ingress.class: nginx
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled:false
  minReplicas:1
  maxReplicas:3
  targetCPUUtilizationPercentage:70
  targetMemoryUtilizationPercentage:80

  


