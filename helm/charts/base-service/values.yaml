image:
  repository:""
  tag:"latest"
  pullPolicy: IfNotPresent

replicas:1


service:
  port:80
  targetPort: 8080
  type: ClusterIP

ingress:
  enabled: true
  host: ""  #ko co domain that
  annotations:
    kubernetes.io/ingress.class: nginx
  tls:
    enabled: false  # khong co domain that
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled:false
  minReplicas:1
  maxReplicas:3
  targetCPUUtilizationPercentage:70
  targetMemoryUtilizationPercentage:80

pdb:
enabled:true
minAvailable:1


serviceAccount:
  create: true
  annotations: {}


configmap:
  enabled: true
  data: 
    DATABASE_URL: "postgresql://user:pass@postgres:5432/mydb"
    APP_MODE: "production"
    LOG_LEVEL: "info"
    CACHE_TTL: "300"
    #demo azure goi free ko chay noi k8s


env: {} 


healthCheck:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10

namespace: default


  


