# environments/production/notification-service.yaml

namespace: production
replicas: 2

image:
  repository: myregistry.azurecr.io/notification-service
  tag: v1.1.0
  pullPolicy: Always

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: api.notification.example.com
  annotations:
    kubernetes.io/ingress.class: nginx
  tls:
    enabled: true
    secretName: notification-tls

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}

configmap:
  enabled: true
  data:
    SMTP_HOST: "smtp.sendgrid.net"
    SMTP_PORT: "587"
    KAFKA_BROKERS: "kafka.prod:9092"
    LOG_LEVEL: "info"

env: {}

healthCheck:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
