# environments/production/order-service.yaml

namespace: production
replicas: 3

image:
  repository: myregistry.azurecr.io/order-service
  tag: v2.1.0
  pullPolicy: Always

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: api.order.example.com
  annotations:
    kubernetes.io/ingress.class: nginx
  tls:
    enabled: true
    secretName: order-tls

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

serviceAccount:
  create: true
  annotations: {}

configmap:
  enabled: true
  data:
    DATABASE_URL: "postgresql://order:pass@postgres-order.prod:5432/orderdb"
    APP_MODE: "production"
    LOG_LEVEL: "info"
    KAFKA_BROKERS: "kafka.prod:9092"
    REDIS_URL: "redis.prod:6379"

env: {}

healthCheck:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
