# environments/production/interaction-service.yaml

namespace: production
replicas: 2

image:
  repository: myregistry.azurecr.io/interaction-service
  tag: v1.3.0
  pullPolicy: Always

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: api.interaction.example.com
  annotations:
    kubernetes.io/ingress.class: nginx
  tls:
    enabled: true
    secretName: interaction-tls

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}

configmap:
  enabled: true
  data:
    DATABASE_URL: "postgresql://interaction:pass@postgres-interaction.prod:5432/interactiondb"
    REDIS_URL: "redis.prod:6379"
    KAFKA_BROKERS: "kafka.prod:9092"
    LOG_LEVEL: "info"

env: {}

healthCheck:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
