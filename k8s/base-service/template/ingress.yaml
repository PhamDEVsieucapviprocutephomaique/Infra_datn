apiVersion: networking.k8s.io/v1
kind: Ingress
metadata : 
  name : {{.Values.ingressname}}
spec : 
   ingressClassName: nginx
   rules : 
    - host :  {{.Values.host}}
      http :
        paths :
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.appName }}-service
              port:
                number: {{ .Values.servicePort }}