apiVersion:apps/v1
kind:Deployment
metadata:
  name : appdeployment
  namespace:default
  labels:
    app:my-app
    environment:dev
spec :
  replicas:3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app:my-app
    spec:
      containers:
      - name:my-container
        image:myapp:latest
        ports:
        - containerPort:8080

      

