apiVersion:apps/v1
kind:Deployment
metadata:
  name : {{.Values.appname}}-deployment
  namespace:{{.Values.namespace}}
  labels :
    {{- include "base-service.labels" . | nindent 4}}
spec :
  replicas: {{.Values.replicas}}
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app:my-app
    spec:
      containers:
      - name:my-container
        image:myapp:latest
        ports:
        - containerPort:8080

      

