apiVersion : autoscaling/v2
kind : HorizontalPodAutoscaler
metadata :
  name : {{.Values.appname}}-hpa
  namespace: {{.Values.namespace}}
  labels:
    {{- include "base-service.labels" . | nindent 4}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{.Values.appname}}-deployment
  minReplicas : {{.Values.hpa.minReplicas | default 1}}
  maxReplicas : {{.Values.hpa.maxReplicas | default 3}}
  metrics :
  - type: Resource 
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{.Values.hpa.targetCPUUtilizationPercentage | default 50}}
  - type : Resource 
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{.Values.hpa.targetMemoryUtilizationPercentage | default 50}}